<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
  <form method="POST" autocomplete="on">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Páramo Labs" class="login-logo">
    <h1>Crear cuenta</h1>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    {% if success %}<div class="ok">{{ success }}</div>{% endif %}
    {% if not success %}
      <input type="text" name="name" placeholder="Nombre completo" autofocus required>
      <input type="text" name="role" placeholder="Cargo (ej: CEO de Páramo Labs S.A.S.)">
      <input type="email" name="email" placeholder="Email" autocomplete="username" required>
      <input
        type="tel"
        name="password"
        placeholder="Contraseña"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="new-password"
        class="numeric-mask"
        required>
      <input
        type="tel"
        name="password2"
        placeholder="Repetir contraseña"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="new-password"
        class="numeric-mask"
        required>
      <button type="submit">Crear cuenta</button>
    {% endif %}
    <div class="alt-link"><a href="{{ url_for('auth.login') }}">Ya tengo cuenta</a></div>
  </form>
</body>
</html>
