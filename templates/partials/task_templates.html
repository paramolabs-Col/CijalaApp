<div id="templatesPage">
  <header>
    <div class="header-inner">
      <div class="eyebrow">Biblioteca reutilizable</div>
      <h1>Plantillas de publicación</h1>
      <div class="subrange">Armá cada tarea una vez (hora + red + texto) y reusala en cualquier campaña</div>
    </div>
  </header>

  <main class="templates-main">
    <form id="templateForm" class="template-form">
      <div class="template-form-row">
        <input id="tplTime" type="text" placeholder="Hora (ej: 8:00 a.m.)" required style="max-width:180px;">
      </div>
      <div class="platform-checks" id="tplPlatforms">
        <label><input type="checkbox" value="fb"> Facebook</label>
        <label><input type="checkbox" value="igfeed"> IG Feed</label>
        <label><input type="checkbox" value="igstory"> IG Story</label>
        <label><input type="checkbox" value="wa"> WhatsApp</label>
        <label><input type="checkbox" value="wadirect"> WhatsApp directo</label>
      </div>
      <input id="tplLabel" type="text" placeholder="Título de la tarea (ej: Publicar post de feature)" required>
      <textarea id="tplDesc" placeholder="Descripción (opcional)"></textarea>
      <button type="submit">Guardar plantilla</button>
    </form>

    <div id="templatesList"></div>

    <hr style="margin:36px 0; border:none; border-top:1px solid var(--line);">

    <h2 style="font-size:16px; margin-bottom:4px;">Plantillas de día (combos)</h2>
    <div class="subrange" style="color:#5b7482; margin-bottom:14px;">Agrupá varias tareas para aplicarlas a un día completo de un solo clic</div>

    <form id="dayTemplateForm" class="template-form">
      <input id="dtName" type="text" placeholder="Nombre del combo (ej: Día estándar)" required>
      <div id="dtTaskChecklist" class="dt-checklist"></div>
      <button type="submit">Guardar plantilla de día</button>
    </form>

    <div id="dayTemplatesList"></div>
  </main>
</div>
